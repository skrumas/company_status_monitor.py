name: Company Status Monitor

on:
  schedule:
    # 1 saatte bir çalıştır (0. dakikada)
    - cron: '0 */1 * * *'
  workflow_dispatch:

# Bu blok, aynı anda birden fazla kopyanın çalışmasını engeller.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push changes
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements_github.txt

      - name: Run Monitor Script
        env:
          PRISYNC_COOKIE: ${{ secrets.PRISYNC_COOKIE }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          python company_status_monitor.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          # Değişiklik varsa commit at, yoksa hata verme
          git add company_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update company status [skip ci]" && git push)
